name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 9 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Cache NuGet Packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore RecyclingApp.sln

    - name: Build
      run: dotnet build RecyclingApp.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test RecyclingApp.sln --configuration Release --no-build --verbosity normal

    - name: Build Docker Image
      run: docker build -t recycling-app:ci-build .
      
    - name: Validate Docker Compose
      run: docker compose config
